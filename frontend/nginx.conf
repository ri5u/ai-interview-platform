server {
    listen 80;
    server_name int-ai.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name int-ai.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/int-ai.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/int-ai.duckdns.org/privkey.pem;

    # 1. Serve compiled React SPA static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy REST API requests to Node.js backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy native WebSocket upgrades to Node.js backend
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
    }

    # 4. Proxy health check endpoint for Jenkins/Docker verification
    location /health {
        proxy_pass http://backend:8080/health;
    }
}